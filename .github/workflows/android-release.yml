name: Release · Android app

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and publish Android packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Android signing secret is missing: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          umask 077
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/koalamusic-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/koalamusic-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict \
            ktlintCheck test lint assembleRelease bundleRelease

      - name: Collect packages and checksums
        id: artifacts
        run: |
          mkdir -p dist
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist/ \;
          if [ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::Gradle produced no APK or AAB."
            exit 1
          fi
          (cd dist && sha256sum ./* > SHA256SUMS)
          archive="koalamusic-android-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../$archive" .)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify package signatures
        run: |
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner was not found below $ANDROID_HOME/build-tools."
            exit 1
          fi
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            "$apksigner_bin" verify --verbose --print-certs "$apk"
          done
          for bundle in dist/*.aab; do
            [ -e "$bundle" ] || continue
          jarsigner -verify "$bundle"
          done

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*
            ${{ steps.artifacts.outputs.archive }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koalamusic-android-${{ github.ref_name }}
          path: |
            dist/*
            ${{ steps.artifacts.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "KoalaMusic Android $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.artifacts.outputs.archive }}" \
            dist/*

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/koalamusic-release.jks"
